<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Bağlantı yok | apartmanOS</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#ddecff 0,transparent 32%),#f4f8fc;color:#0b2340;font-family:"Segoe UI",Arial,sans-serif}.card{width:min(100%,480px);padding:32px;border:1px solid #dbe6ef;border-radius:22px;background:#fff;box-shadow:0 24px 70px #073b731c}.brand{display:flex;align-items:center;gap:12px;color:#073b73;font-size:20px;font-weight:800}.brand img{width:52px;height:52px;object-fit:contain}.card h1{margin:28px 0 10px;font-size:30px;line-height:1.15;letter-spacing:-.04em}.card p{margin:0;color:#64778b;font-size:16px;line-height:1.7}.card button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:12px;background:linear-gradient(135deg,#073b73,#087bde 60%,#0a9bf2);color:#fff;font:inherit;font-weight:800;cursor:pointer}.card button:focus-visible{outline:3px solid #7acbff;outline-offset:3px}

</head>
