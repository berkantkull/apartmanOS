<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="apartmanOS ile aidat, gider, duyuru ve kararları tek yerden yönetin." />
  <meta name="theme-color" content="#123c69" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123c69'/%3E%3Cpath d='M15 50V24l17-11 17 11v26H15Z' fill='%23fff'/%3E%3Cpath d='M26 50V35h12v15M22 28h6v6h-6zm14 0h6v6h-6z' fill='%231dc7b7'/%3E%3C/svg%3E" />
  <title>apartmanOS — Yönetim artık daha kolay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Ana menü">
      <a class="brand" href="#" aria-label="apartmanOS ana sayfa">
        <span class="brand-mark" aria-hidden="true"><span></span><i></i></span>
        <span>apartman<span>OS</span></span>
      </a>
      <div class="site-switcher">
        <span class="site-avatar">Y</span>
        <div><strong>Yaşam Sitesi</strong><small>A Blok · 24 daire</small></div>
        <button aria-label="Site değiştir">⌄</button>
      </div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span>Genel Bakış</button>
        <button class="nav-item" data-page="dues"><span>₺</span>Aidat &amp; Borçlar <b>5</b></button>
        <button class="nav-item" data-page="expenses"><span>↗</span>Giderler</button>
        <button class="nav-item" data-page="announcements"><span>◌</span>Duyurular</button>
        <button class="nav-item" data-page="decisions"><span>✓</span>Karar Defteri</button>
        <button class="nav-item" data-page="residents"><span>♙</span>Sakinler</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span>⚙</span>Ayarlar</button>
        <button class="help-card"><span>?</span><div><strong>Yardıma mı ihtiyacınız var?</strong><small>Destek merkezine ulaşın</small></div></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Menüyü aç" aria-expanded="false">☰</button>
        <div class="topbar-title"><small>22 Eylül 2026, Salı</small><strong id="pageTitle">Genel Bakış</strong></div>
        <div class="topbar-actions">
          <button class="icon-button" aria-label="Bildirimler">♢<span></span></button>
          <button class="profile-button"><span>BK</span><div><strong>Berkant Kul</strong><small>Yönetici</small></div><i>⌄</i></button>
        </div>
      </header>

      <div id="pageContent" class="page-content" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="actionDialog">
    <form method="dialog" id="actionForm">
      <div class="dialog-head"><div><span class="eyebrow">YENİ KAYIT</span><h2 id="dialogTitle">Kayıt ekle</h2></div><button value="cancel" class="close-button" aria-label="Kapat">×</button></div>
      <div id="dialogFields"></div>
      <div class="dialog-actions"><button value="cancel" class="button secondary">Vazgeç</button><button value="default" id="saveButton" class="button primary">Kaydet</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
